<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 1 - Perulangan Angka</title>
</head>
<body>
    <h1>Tugas 1 - Perulangan Angka</h1>

    <script>
        console.log("=== ANGKA 1 SAMPAI 20 ===");
        for (let i = 1; i <= 20; i++) {
            console.log(i);
        }
        console.log("=== ANGKA GENAP 2 SAMPAI 20 ===");
        for (let i = 2; i <= 20; i += 2) {
            console.log(i);
        }
        console.log("=== ANGKA 10 SAMPAI 1 ===");
        for (let i = 10; i >= 1; i--) {
            console.log(i);
        }
    </script>
</body>
</html>
