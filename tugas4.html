
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 4 - Program Nilai Siswa</title>
</head>
<body>
    <h1>Tugas 4 - Program Nilai Siswa</h1>

    <script>
        function cekNilai(nama, nilai) {
            if (nilai >= 75) {
                return "Lulus";
            } else {
                return "Belum Lulus";
            }
        }

        let siswa = [
            { nama: "raditya", nilai: 95 },
            { nama: "alia", nilai: 90 },
            { nama: "liara", nilai: 80 },
            { nama: "Dina", nilai: 65 },
            { nama: "fahara", nilai: 78 }
        ];

        console.log("=== DAFTAR NILAI SISWA ===");

        for (let i = 0; i < siswa.length; i++) {
            let status = cekNilai(
                siswa[i].nama,
                siswa[i].nilai
            );

            console.log("Nama: " + siswa[i].nama);
            console.log("Nilai: " + siswa[i].nilai);
            console.log("Status: " + status);
            console.log("--------------------");
        }
    </script>
</body>
</html>
