<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Praktik While</title>
</head>

<body>
    <h1>Perbandingan Perulangan</h1>
    <script>
        console.log("=== WHILE ===");
        let angka1 = 1;
        while (angka1 <= 5) {
            console.log(angka1);
            angka1++;
        }
        console.log("=== DO WHILE ===");
        let angka2 = 3;
        do {
            console.log(angka2);
            angka2++;       
        } while (angka2 <= 5);
    </script>
</body>

</html>
