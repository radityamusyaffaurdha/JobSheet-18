
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 3 - Function Perhitungan</title>
</head>
<body>
    <h1>Tugas 3 - Menghitung Rata-Rata</h1>
    <script>
        function hitungRataRata(nilai1, nilai2, nilai3) {
            let rataRata = (nilai1 + nilai2 + nilai3) / 3;
            return rataRata;
        }
        let hasil = hitungRataRata(80, 90, 85);
        console.log("=== HASIL RATA-RATA ===");
        console.log("Nilai 1: 80");
        console.log("Nilai 2: 90");
        console.log("Nilai 3: 85");
        console.log("Rata-rata: " + hasil);
    </script>
</body>
</html>
